<!DOCTYPE html>
<html lang="bg">
    {{- partial "head.html" . -}}
    <body class="bodhi">
        {{- partial "header.html" . -}}
        <main id="content">
        {{- block "main" . }}{{- end }}
        </main>
        {{- partial "footer.html" . -}}

        {{ $js := resources.Get "js/bodhi.js" }}
        {{ $script := $js | resources.Minify | resources.Fingerprint }}
        <script src="{{ $script.Permalink }}" integrity="{{ $script.Data.Integrity }}"></script>
    </body>
</html>
